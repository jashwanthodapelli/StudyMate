<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate AI - Explainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden antialiased">
    
    <!-- Unique EdTech Sidebar -->
    <aside class="w-[280px] bg-gradient-to-b from-indigo-900 via-purple-900 to-indigo-950 text-white flex-shrink-0 flex-col transition-all duration-300 hidden md:flex h-full shadow-2xl z-20">
        <div class="h-24 flex items-center px-6 border-b border-white/10">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 to-indigo-500 flex items-center justify-center mr-4 shadow-lg shadow-cyan-500/30 border border-white/20">
                 <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <span class="font-black text-xl tracking-tight text-white drop-shadow-sm">StudyMate</span>
                    <span class="bg-gradient-to-r from-amber-200 to-amber-500 text-amber-900 text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider shadow-sm">PRO</span>
                </div>
                <span class="text-[10px] text-indigo-300 font-bold tracking-widest uppercase mt-0.5">Premium Toolkit</span>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-4 py-8 space-y-2">
            <div class="text-[11px] font-bold text-indigo-300/60 mb-4 px-2 tracking-widest uppercase">Your Tools</div>
            
            <a href="/" class="flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-white/10 text-white text-sm font-semibold shadow-[inset_0_2px_10px_rgba(255,255,255,0.1)] border border-white/10 backdrop-blur-sm transition-all group">
                <svg class="w-5 h-5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                AI Explainer
            </a>
            
            <a href="/quiz" class="flex items-center gap-4 px-4 py-3.5 rounded-2xl hover:bg-white/5 text-indigo-200 hover:text-white text-sm font-semibold border border-transparent hover:border-white/10 transition-all hover:shadow-[0_4px_15px_rgba(0,0,0,0.1)] group">
                <svg class="w-5 h-5 text-indigo-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Quiz Generator
            </a>
            
            <a href="/flashcards" class="flex items-center gap-4 px-4 py-3.5 rounded-2xl hover:bg-white/5 text-indigo-200 hover:text-white text-sm font-semibold border border-transparent hover:border-white/10 transition-all hover:shadow-[0_4px_15px_rgba(0,0,0,0.1)] group">
                <svg class="w-5 h-5 text-indigo-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Flashcards
            </a>
        </nav>

        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-white/5 cursor-pointer transition-colors border border-transparent hover:border-white/10">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-400 to-indigo-500 overflow-hidden shadow-inner flex shrink-0"></div>
                <div class="truncate">
                    <div class="font-bold text-sm text-white">Pro Student</div>
                    <div class="text-[11px] text-indigo-300">Premium Active</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-y-auto w-full" id="scroll-container">
        
        <!-- Sticky Header (z-50 Fixed Layout Overflow) with Backdrop Blur -->
        <div class="w-full bg-slate-50/80 backdrop-blur-xl shadow-sm border-b border-slate-200 relative z-50 sticky top-0">
            <div class="max-w-4xl mx-auto px-8 py-8 w-full">
                <h1 class="text-3xl font-black text-slate-800 mb-2 tracking-tight">AI Explainer</h1>
                <p class="text-slate-500 mb-6 font-medium text-[15px]">Master any concept instantly. Type below and build a reference guide.</p>
                
                <form id="explainer-form" class="flex flex-col md:flex-row gap-4 w-full">
                    <input type="text" id="topic" name="topic" class="flex-1 bg-white border-2 border-slate-200 outline-none py-3.5 px-6 rounded-2xl text-[16px] text-slate-800 focus:border-indigo-400 transition-all font-medium placeholder-slate-400 shadow-sm" placeholder="e.g. Quantum Physics, Photosynthesis..." required autocomplete="off">
                    
                    <select id="level" name="level" class="bg-indigo-50 text-indigo-700 font-bold border-none outline-none py-3.5 px-6 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 transition-all cursor-pointer shadow-sm">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                    
                    <button type="submit" id="generate-btn" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3.5 px-8 rounded-2xl shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-3 hover:-translate-y-0.5 whitespace-nowrap">
                        <span id="btn-text">Generate</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Continuous Results Feed -->
        <div class="flex-1 pt-8 pb-32 w-full">
            <div class="max-w-4xl mx-auto px-8 w-full flex flex-col gap-8" id="results-feed">
                 <!-- Empty State Message -->
                 <div id="empty-state" class="text-center py-20 opacity-50 w-full">
                     <svg class="w-20 h-20 mx-auto text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                     <p class="text-lg font-bold text-slate-400">Search a topic above to begin building your guide layer by layer.</p>
                 </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('explainer-form');
            if(!form) return;
            
            const generateBtn = document.getElementById('generate-btn');
            const btnText = document.getElementById('btn-text');
            const resultsFeed = document.getElementById('results-feed');
            const emptyState = document.getElementById('empty-state');
            const topicInput = document.getElementById('topic');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const levelInput = document.getElementById('level');
                const topic = topicInput.value.trim();
                const level = levelInput.value;
                if (!topic) return;

                if(emptyState) emptyState.classList.add('hidden');

                const newCardId = 'card-' + Date.now();
                // Custom Light Mode dot animation loader
                const cardHtml = `
                     <div id="${newCardId}" class="bg-white rounded-[2rem] p-10 shadow-xl shadow-slate-200/50 border border-slate-100 relative overflow-hidden transition-all duration-500 opacity-0 translate-y-4">
                         <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-50 rounded-bl-[100px] opacity-50 -z-0"></div>
                         
                         <div class="flex items-start gap-5 mb-8 pb-6 border-b border-slate-100 relative z-10 w-full">
                              <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center shrink-0">
                                  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                              </div>
                              <div class="w-full">
                                  <p class="text-[11px] font-bold text-indigo-500 uppercase tracking-widest mt-1 mb-1">${level}</p>
                                  <h2 class="text-3xl font-bold text-slate-800 tracking-tight break-words">${topic}</h2>
                              </div>
                         </div>
                         <div id="content-${newCardId}" class="text-slate-700 leading-loose text-[17px] font-medium relative z-10 w-full">
                             <div class="flex items-center gap-1.5 mt-2 h-6">
                                 <div class="w-2.5 h-2.5 bg-indigo-400 rounded-full animate-bounce"></div>
                                 <div class="w-2.5 h-2.5 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
                                 <div class="w-2.5 h-2.5 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
                             </div>
                         </div>
                     </div>
                `;
                
                resultsFeed.insertAdjacentHTML('afterbegin', cardHtml);
                const currentCard = document.getElementById(newCardId);
                const contentArea = document.getElementById(`content-${newCardId}`);
                
                document.getElementById('scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
                topicInput.value = '';

                setTimeout(() => {
                    currentCard.classList.remove('opacity-0', 'translate-y-4');
                }, 50);

                generateBtn.disabled = true;
                btnText.textContent = 'Generating...';
                
                try {
                    const response = await fetch('/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ topic, level })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.explanation) {
                        let formattedText = data.explanation
                            .replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 font-bold">$1</strong>')
                            .replace(/\*(.*?)\*/g, '<em class="text-indigo-800">$1</em>')
                            .replace(/\n\n/g, '</p><p class="mt-5">')
                            .replace(/\n/g, '<br>');
                            
                        contentArea.innerHTML = `<p>${formattedText}</p>`;
                    } else {
                        contentArea.innerHTML = `<p class="text-red-500 font-bold bg-red-50 p-4 rounded-xl">${data.error || 'Failed to generate explanation.'}</p>`;
                    }
                } catch (error) {
                    console.error('Error:', error);
                    contentArea.innerHTML = `<p class="text-red-500 font-bold bg-red-50 p-4 rounded-xl">An error occurred while connecting to the server.</p>`;
                } finally {
                    generateBtn.disabled = false;
                    btnText.textContent = 'Generate';
                }
            });
        });
    </script>
</body>
</html>
