<!DOCTYPE html>
<html>
<head>
<title>StudyMate AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="flex h-screen">

<div class="w-64 bg-gray-800 text-white p-6">
<h1 class="text-2xl font-bold mb-6">StudyMate AI</h1>

<ul class="space-y-4">
<li><a href="/">AI Explainer</a></li>
<li><a href="/quiz">Quiz Generator</a></li>
<li><a href="/flashcards">Flashcards</a></li>
</ul>
</div>

<div class="flex-1 p-10">

<h2 class="text-3xl mb-5">AI Topic Explainer</h2>

<input id="topic" class="border p-2 w-full mb-3" placeholder="Enter topic">

<select id="level" class="border p-2 mb-3">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
</select>

<button onclick="generateExplanation()" class="bg-blue-500 text-white px-4 py-2">
Generate
</button>

<div id="result" class="mt-6 bg-white p-4 rounded shadow"></div>

</div>
</div>

<script src="/static/js/main.js"></script>

</body>
</html>
